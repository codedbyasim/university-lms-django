{% extends 'base.html' %}

{% block title %}Vote in Poll{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header text-center bg-maroon text-white"> {# Changed bg-primary to bg-maroon #}
                <h3 class="mb-0">Vote in Poll</h3>
            </div>
            <div class="card-body">
                <h4 class="mb-4">{{ poll.question }}</h4>
                <form method="post">
                    {% csrf_token %}
                    {% for choice in poll.choices.all %}
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="choice" id="choice{{ choice.pk }}" value="{{ choice.pk }}" required>
                            <label class="form-check-label" for="choice{{ choice.pk }}">
                                {{ choice.choice_text }}
                            </label>
                        </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Submit Vote</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
